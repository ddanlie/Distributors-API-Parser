<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>DistribAPI</title>
    <link rel="stylesheet" href="public/styles/index.css">
    <!-- <link rel="icon" href="./favicon.ico" type="image/x-icon"> -->
  </head>
  <body>
    <main class="flex flex-col items-center space-y-6 pt-10">
        <div class="flex flex-col gap-1 items-center">
          <h1 class="font-medium text-4xl">Search results</h1>
        </div>
        <div class="h-32"></div>
        {% for item in items %}
            <div class="flex justify-center w-full border-y-[1px]">
              <div class="flex justify-between p-5">
                  <div class="min-w-[500px] max-w-[500px] flex flex-col items-start gap-1">
                    <div>
                        <h1 class="font-light text-sm -ml-10">{{ item.client_name }}</h1>
                        <h1 class="font-bold">{{ item.names[0] }}</h1>
                    </div>
                    <h1>{{ item.description }}</h1>
                  </div>
                  <div class="flex justify-end">
                      <h1 class="font-bold text-[12px] pl-10 mt-6">{{ item.price }} {{ item.currency }}</h1>
                  </div>
              </div>
            </div>
        {% endfor %}
    </main>
      <script src="public/scripts/index.js"></script>
  </body>
</html>
